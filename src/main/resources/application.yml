spring:
  profiles:
    active: local
#    激活指定的环境配置文件，自动加载local
  application:
     name: ai-autocode
  # session ??
  session:
    store-type: redis
    # session 30 ???
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_autocode
    username: root
    password: 123456

server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi
#  ??????
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yjx.aiautocode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn






